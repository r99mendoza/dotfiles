# Change prefix from 'Ctrl+b' to 'Ctrl+\'
set -g prefix 'C-\'
unbind C-b
bind-key 'C-\' send-prefix

unbind-key r
bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf sourced"

# Window Navigation
bind-key -n C-Left    previous-window
bind-key -n C-Right   next-window
bind-key -n C-S-Left  swap-window -d -t -1
bind-key -n C-S-Right swap-window -d -t +1
# Create a new window with 4 panes
bind-key o new-window \; split-window \; split-window -h \; select-pane -U \; split-window -h

# Split panes using | and -
unbind-key %
bind-key '\' split-window -h -c "#{pane_current_path}" # creates a new pane to the right of the current pane in cwd
unbind-key '"'
bind-key - split-window -v -c "#{pane_current_path}"  # creates a new pane below the current pane in cwd

# Switch panes using Shift-arrow
bind-key -n S-Left  select-pane -L
bind-key -n S-Right select-pane -R
bind-key -n S-Up    select-pane -U
bind-key -n S-Down  select-pane -D
bind-key > swap-pane -D # swap current pane with the next one
bind-key < swap-pane -U # swap current pane with the previous one

# Resize Panes
bind-key -r Left  resize-pane -L 10
bind-key -r Right resize-pane -R 10
bind-key -r Up    resize-pane -U 10
bind-key -r Down  resize-pane -D 10

set -g base-index 1         # start windows numbering at 1
setw -g pane-base-index 1   # make pane numbering consistent with windows
set -g renumber-windows on  # renumber all windows when any window is closed
set -g allow-rename off     # don't rename windows automatically
set -g status-interval 10   # update the status line every 10 seconds
set -sg escape-time 10      # faster command sequences
set -g focus-events on      # Recommended by neovim :checkhealth
set -g history-limit 5000
set -g mouse on             # enable mouse support
setw -g word-separators " '\",=()[]{}<>$*^#!`;\t:"

# start selecting text with "v" and copy the text with "y"
setw -g mode-keys vi
unbind p
bind p paste-buffer
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# Undercurl - To have undercurls show up and in color
# Obtained from: https://github.com/folke/tokyonight.nvim#:~:text=Fix%20undercurls%20in%20Tmux
# https://github.com/orgs/tmux/discussions/3827 and https://github.com/microsoft/terminal/pull/15795
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

set -as terminal-features ",*:RGB" # true color support, enable 24 bit colors

### START OF THEME
# ==================
# TokyoNight Color Variables
# ==================
set -g @color_active_bg "colour24"         # Dark blue (#1a1b26)
set -g @color_inactive_bg "colour237"      # Dim blue-gray (#3b4261)
set -g @color_border_active "colour110"    # Cyan-green (#73daca)
set -g @color_border_inactive "colour60"   # Muted purple-gray (#565f89)
set -g @color_status_bg "colour235"        # Near-black (#16161e)
set -g @color_status_fg "colour253"        # Light foreground (#c0caf5)
set -g @color_status_right_bg "colour60"   # Muted purple-gray (#565f89)
set -g @color_status_right_fg "colour253"  # Light foreground (#c0caf5)

# ==================
# Pane border styles
# ==================
set -g pane-active-border-style "fg=#{@color_border_active} bg=default"
set -g pane-border-style "fg=#{@color_border_inactive} bg=default"

# ==================
# Status bar styling (use status-style ffor variable expansion)
# ==================
set -g status-style "fg=#{@color_status_fg} bg=#{@color_status_bg}"
set -g status-right-style "fg=#{@color_status_right_fg} bg=#{@color_status_right_bg} bold"
time='[Austin: #(TZ="America/Chicago" date +"%%H:%%M")]'
set -g status-right "[#{session_name}] $time"
set -g status-left ""

# ==================
# Window list styling
# ==================
setw -g window-status-current-format " #{window_index} #{window_name} "
setw -g window-status-current-style "fg=#{@color_status_fg} bg=#{@color_active_bg} bold"
setw -g window-status-format " #{window_index} #{window_name} "
setw -g window-status-style "fg=#{@color_status_fg} bg=#{@color_inactive_bg}"
setw -g window-status-separator " "
### END OF THEME

############################################
# Plugin Management:
# tpm: https://github.com/tmux-plugins/tpm
############################################
# Plugins and their configurations

# TMUX plugin manager comes first
# Prefix + I = Install
# Prefix + U = Update
# Prefix + u = Clean
set -g @plugin 'tmux-plugins/tpm'

# Tmux resurrect (save and restore sessions)
# Prefix + Ctrl-s = Save
# Prefix + Ctrl-r = Restore
set -g @plugin 'tmux-plugins/tmux-resurrect'

